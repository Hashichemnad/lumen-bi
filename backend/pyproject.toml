[project]
name = "lumen-bi"
version = "0.1.0"
description = "Lumen BI backend: API, sync workers and query engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "celery>=5.4",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "cryptography>=43",
    "duckdb>=1.1",
    "pytz>=2024.1",  # DuckDB needs it to return time-zone-aware timestamps
    "pyarrow>=17",
    "oracledb>=2.4",
    "openpyxl>=3.1",
    "croniter>=3.0",
    "playwright>=1.48",  # headless Chromium for PDF/PNG exports of dashboards
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
